<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <style>
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #eee;
      padding: 30px 50px;
      border: 1px solid #ccc;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      font-family: Arial, sans-serif;
      z-index: 1000;
    }

    .popup h2 {
      margin-top: 0;
      color: #333;
    }

    .popup .close-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      background-color: red;
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
    <script src="main.js"></script>
</body>
</html>
